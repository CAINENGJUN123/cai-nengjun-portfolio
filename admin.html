<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内容管理说明｜蔡能均个人网站</title>

<body>
  <main class="admin-shell">
    <section class="login-view">
      <a class="back-link" href="./">← 返回个人网站</a>
      <div class="login-card">
        <div class="login-card__mark">CN</div>
        <p class="eyebrow">GITHUB PAGES</p>
        <h1>展示版已准备好</h1>
        <p>
          当前网站已发布到 GitHub Pages。网站包含六支完整 AIGC 视频、项目图片，

        <div class="password-field">
          <a class="upload-button" href="./" style="text-align:center;text-decoration:none;">查看网站 →</a>
